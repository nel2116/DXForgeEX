# ネイティブ側のビルドと、ヘッドレス自動テストを実行するCI。
#
# スコープについて:
#   - ContentTools は FBX SDK(Autodesk の配布物でランナーに無い)が必要なため、ランナーではビルドできない。
#     ソリューション構成 Debug / Release ではそもそもビルド対象外なので、ここでは触らない。
#   - EngineTest はビルドのみ可能(実行にはウィンドウとGPUが必要)。
#   - EngineUnitTests は GPU もウィンドウも不要なため、CIで実際に実行できる。
#     build.ps1 -RunTests は、続けてヘッドレス実行(EngineUnitTests.exe --game-bin)のテストを
#     python で実行する(EngineUnitTests/Tests/headless_run_test.py、#11)。
#     続けて、GPUのないランナーでWARPを使った描画のヘッドレス実行(EngineUnitTests.exe --render)を確かめる
#     (EngineUnitTests/Tests/render_run_test.py、#127)。
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  native:
    name: Native build & tests (${{ matrix.configuration }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # Release は NDEBUG で assert が無効化され挙動が変わるため、両構成を検証する。
        configuration: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      # GetDXC.ps1 は packages/ が空のとき DXC の最新版をダウンロードする。
      # packages/ はリポジトリに含めていないため、キャッシュしないと毎回ダウンロードが走り、
      # GitHub API のレート制限でCIが不安定になる。
      # キャッシュはそのrunのref・PRのbase・既定のブランチのものしか使えず、外れることがあるため、
      # 外れたときに備えて下のステップで GITHUB_TOKEN を渡し、APIを認証付きで呼ぶ(#84)。
      - name: Cache DirectX Shader Compiler
        uses: actions/cache@v4
        with:
          path: packages/DirectXShaderCompiler
          key: dxc-${{ runner.os }}-v1

      # headless_run_test.py を実行する python を固定する(ランナーの既定に頼らない)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build and run unit tests
        shell: pwsh
        # GetDXC.ps1 が GitHub API を認証付きで呼ぶために使う(未認証の上限はランナーのIPで共有される)。
        # secrets の値はActionsがログ上で伏せ字にし、GetDXC.ps1 自身もトークンを出力しない。
        #
        # DXFORGE_REQUIRE_RENDER_TEST=1: render_run_test.py は DXC(dxcompiler.dll)が EngineUnitTests.exe の隣にないと
        # 描画のテストをスキップするが、CIではソリューション全体をビルドして DXC があるはずなので、スキップを失敗にする(#127)。
        #
        # DXFORGE_RENDER_DIFF_DIR: WARPの描画が基準画像(EngineUnitTests/Tests/baselines/)と違ったときに、
        # render_run_test.py が expected/actual/diff の PNG を書くフォルダ。下の手順で成果物にする(#127)。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DXFORGE_REQUIRE_RENDER_TEST: '1'
          DXFORGE_RENDER_DIFF_DIR: ${{ runner.temp }}/render-diff-${{ matrix.configuration }}
        run: ./build.ps1 -Target native -Configuration ${{ matrix.configuration }} -RunTests -WarningsAsErrors

      # 基準画像との比較が失敗したときだけ、差分の画像が書かれる。比較以外の理由で失敗したときは
      # ファイルがないので、この手順は何もしない(ignore)
      - name: Upload the render diff
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: render-diff-${{ matrix.configuration }}
          path: ${{ runner.temp }}/render-diff-${{ matrix.configuration }}
          if-no-files-found: ignore

      # WARPで描画したPNGを、ランナーでWARPが使えたことの証拠として残す(#127)。ログにはアダプタ名と
      # デバッグレイヤーの有無(Debug)、使ったD3D12のランタイム(--json の d3d12_runtime。Agility SDK とそのバージョン、#155)が出る。
      # 基準画像との比較と、Agility SDK のランタイムを使ったことの確認は render_run_test.py が行う。
      - name: Render a screenshot with WARP
        if: success() || failure()
        shell: pwsh
        run: |
          $png = Join-Path $env:RUNNER_TEMP "render_warp_${{ matrix.configuration }}.png"
          $sw = [Diagnostics.Stopwatch]::StartNew()
          & x64/${{ matrix.configuration }}/EngineUnitTests.exe --render --frames 3 --width 320 --height 240 --screenshot $png --adapter warp --json
          $code = $LASTEXITCODE
          Write-Host "exit code $code, $($sw.Elapsed.TotalSeconds) s"
          exit $code

      - name: Upload the WARP screenshot
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: render-warp-${{ matrix.configuration }}
          path: ${{ runner.temp }}/render_warp_${{ matrix.configuration }}.png
          if-no-files-found: warn

  editor:
    name: Editor build
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ファイル規約(BOM、ナローリテラルの日本語、ヘッダーコメント)の検査。Claude Code では同じスクリプトが
      # 編集のたびに PostToolUse フックで動く(.claude/settings.json)。ビルドより速いので先に実行する。
      # 必須のチェックを増やさずに済むよう、別のジョブにせずこのジョブに入れる。
      - name: Check file conventions
        shell: pwsh
        run: |
          python Tests/check_conventions_test.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python Tests/check_conventions.py

      # エージェントが merge-ok(人のマージの承認)を付けるのを止める PreToolUse フックのテスト(#160)
      - name: Merge approval guard tests
        shell: pwsh
        run: python Tests/guard_merge_approval_test.py

      # レビューの流れのフックと集計のテスト(#195)。使い捨てのリポジトリと偽の記録で動き、GitHub は呼ばない。
      - name: Review flow guard, context warning and usage report tests
        shell: pwsh
        run: |
          foreach ($test in "guard_review_flow_test", "guard_gui_images_test", "context_size_warning_test", "usage_report_test") {
            python "Tests/$test.py"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # CodexReview.ps1(目印と -SetStatus の省略)、PrePr.ps1(対応表とスタンプ)、ワーカーの管理のスクリプト(#195)。
      # 偽の gh / codex / orca を PATH の先頭に置くので、本物の GitHub、Codex、Orca は呼ばない。
      - name: CodexReview.ps1 tests
        shell: pwsh
        run: ./Tests/CodexReview.Tests.ps1

      - name: PrePr.ps1 tests
        shell: pwsh
        run: ./Tests/PrePr.Tests.ps1

      - name: Worker tools tests
        shell: pwsh
        run: ./Tests/WorkerTools.Tests.ps1

      # DXForgeEditor は net8.0-windows を対象にしている。ランナーに必要なバージョンの
      # SDKが同梱されているとは限らないため、SDKを明示的に用意する。
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build editor
        shell: pwsh
        run: ./build.ps1 -Target editor -Configuration DebugEditor -WarningsAsErrors

      # エディタのシェーダのコンパイルとアセットのリソース(Primal Day 076/077)を通す DLL。エディタと同じ x64\DebugEditor\ に出力する。
      # 以前は Script.cpp の get_script_names() が ATL(atlsafe.h)を使っていて、ATL のないランナーではビルドできなかった(#146)。
      # DXC は NuGet の Microsoft.Direct3D.DXC(バージョン固定)を使うので、GetDXC.ps1 も GitHub API も要らない。
      - name: Build engine DLL (DebugEditor)
        shell: pwsh
        run: ./build.ps1 -Target native -Configuration DebugEditor -Project DXForgeEngineDLL -WarningsAsErrors

      # コマンドラインのインポーター DXForgeImport(#10)の引数・異常系のテスト。ContentTools.dll は FBX SDK が要るので
      # ランナーではビルドできないが、引数の解析と、入力なし・未対応の拡張子・設定の誤りなどの終了コードと --json の出力、
      # ContentTools.dll がないときの終了コード7は、それなしで確かめられる。実際のインポートはローカルで確かめる。
      - name: Test DXForgeImport (arguments only)
        shell: pwsh
        run: pwsh -STA -NoProfile -File DXForgeImport/Tests/import_cli_test.ps1 -Configuration DebugEditor -ArgumentsOnly

      # dxforge --load-project(#11)のランナー。dxforge(DebugEditor)は x64\Debug\EngineUnitTests.exe を使う(build.ps1 の出力の配置)。
      - name: Build headless runner (EngineUnitTests, Debug)
        shell: pwsh
        run: ./build.ps1 -Target native -Configuration Debug -Project EngineUnitTests -WarningsAsErrors

      - name: Test dxforge --load-project
        shell: pwsh
        run: pwsh -STA -NoProfile -File DXForgeCli/Tests/load_project_cli_test.ps1 -Configuration DebugEditor -RequireRunner

      - name: Test dxforge --ops
        shell: pwsh
        run: pwsh -STA -NoProfile -File DXForgeCli/Tests/ops_cli_test.ps1 -Configuration DebugEditor -RequireRunner

      # gui-check スキルのスクリプトのうち GUI なしで動く部分(#195)。偽の gh / orca を使う。prepare は上でビルドした dxforge で確かめる
      - name: GUI check tools tests
        shell: pwsh
        run: ./Tests/GuiCheck.Tests.ps1 -RequireCli

      - name: Test Project Layout view
        shell: pwsh
        # ProjectLayoutView を画面の外のウィンドウに置いて確かめる(#185)。エンジンのDLLとGPUは要らない。
        run: pwsh -STA -NoProfile -File DXForgeEditor/Tests/project_layout_view_test.ps1 -Configuration DebugEditor

      - name: Test editor engine path resolution
        shell: pwsh
        # ビルドしたエディタの EnginePath(#117)をリフレクションで呼び、worktree・リポジトリの外・DXFORGE_ENGINE と一致の
        # 3つの場合を、%TEMP% の偽のフォルダで確かめる。GUI・GPU・エンジンのDLLは要らない。
        run: pwsh -NoProfile -File DXForgeEditor/Tests/engine_path_test.ps1 -Configuration DebugEditor

      - name: Test editor default projects path
        shell: pwsh
        # ビルドしたエディタの ProjectsPath(#141)をリフレクションで呼び、Create Project の既定のフォルダが
        # DXFORGE_PROJECTS(あり・なし・使えない値)に応じて決まることを確かめる。ユーザー環境変数は読みも書きもしない。
        run: pwsh -NoProfile -File DXForgeEditor/Tests/projects_path_test.ps1 -Configuration DebugEditor

      - name: Test editor DEBUG define
        shell: pwsh
        # DebugEditor でエディタと DXForgeImport に DEBUG が定義され、ReleaseEditor では定義されないこと(#109)。
        # 構成ごとの DefineConstants を評価し、ビルドした DXForgeEditor.dll に Debug.Assert の呼び出しが残っていることを確かめる。
        run: pwsh -NoProfile -File DXForgeEditor/Tests/debug_define_test.ps1 -Configuration DebugEditor

      # NumberBox と VectorBox の値の範囲とイベント(Primal Day 086, #244)。表示せずに作り、ドラッグと入力の確定を直接呼ぶ
      - name: Test editor number boxes
        shell: pwsh
        run: pwsh -STA -NoProfile -File DXForgeEditor/Tests/number_box_test.ps1 -Configuration DebugEditor

      # インスペクターの Transform の編集(Primal Day 086, #244): 上でビルドした DXForgeEngineDLL にエンティティを作り、C# の値とエンジンの値、
      # 保存した .dxproj、ランナー(EngineUnitTests)が読む game.bin が一致することを確かめる。GPU は要らない(エンジンを初期化しない)
      - name: Test editor transform editing
        shell: pwsh
        run: pwsh -STA -NoProfile -File DXForgeEditor/Tests/transform_edit_test.ps1 -Configuration DebugEditor -RequireEngineDll -RequireRunner

      # エディタのマテリアルのアセット(Material / AppliedMaterial)と既定のマテリアル(Primal Day 077, #30)。
      # 上でビルドした DXForgeEngineDLL を使い、実際のシェーダのコンパイルと DLL の CreateResource / DestroyResource も確かめる。
      # -RequireEngineDll で、DLL がないときに項目を SKIP にせず失敗にする(#146)。GPU は要らない(エンジンを初期化しない)。
      - name: Test editor material assets
        shell: pwsh
        run: pwsh -STA -NoProfile -File DXForgeEditor/Tests/material_asset_test.ps1 -Configuration DebugEditor -RequireEngineDll

      # プロジェクトを開けないときの理由(Project.Load の例外の型とメッセージ)が Logger と Project.LastLoadError に残ること、失敗の後始末(Project.ReleaseEntities)がエンジンのエンティティを外すこと(#250)。上でビルドした DXForgeEngineDLL を使い、GUI も GPU も要らない(エンジンを初期化しない)
      - name: Test editor project load errors
        shell: pwsh
        run: pwsh -STA -NoProfile -File DXForgeEditor/Tests/project_load_test.ps1 -Configuration DebugEditor -RequireEngineDll

      # エディタの DllWrappers(EngineAPI.CompileShader / AddShaderGroup / RemoveShaderGroup)を通したシェーダのコンパイルと登録
      # (Primal Day 076, #29)。上でビルドした DXForgeEngineDLL と、その隣の dxcompiler.dll を使う。GUI も GPU も要らない(#146)。
      - name: Test editor shader compilation
        shell: pwsh
        run: pwsh -STA -NoProfile -File DXForgeEngineDLL/Tests/editor_shader_compilation_test.ps1 -Configuration DebugEditor

      # エディタからのエンジンの初期化(Primal Day 078, #31): EngineInitError と C++ の engine_init_error の値、
      # 失敗したときの文言が例外を投げないこと。上でビルドした DXForgeEngineDLL の InitializeEngine / ShutdownEngine を
      # エディタのラッパーから呼び、リポジトリの外の作業フォルダでもエンジンのパス(日本語・ハングルを含むものも)から
      # シェーダーをコンパイルして初期化できることを確かめる(ランナーの既定のアダプタは Basic Render Driver。GPU がなければ
      # Graphics でもよい)。-RequireEngineDll で、DLL がないときは失敗にする。
      - name: Test editor engine initialization
        shell: pwsh
        run: pwsh -STA -NoProfile -File DXForgeEditor/Tests/engine_init_test.ps1 -Configuration DebugEditor -RequireEngineDll

      - name: CleanupMerged.ps1 tests
        shell: pwsh
        # 使い捨てのリポジトリと偽の gh / orca で動かし、本物のGitHubやOrcaは呼ばない(Issue #104)。
        # GUIもビルドも要らないので、別のジョブにせず必須のチェックであるこのジョブに入れる。
        run: ./Tests/CleanupMerged.Tests.ps1

      - name: Restore.ps1 tests
        shell: pwsh
        # 使い捨てのフォルダと偽の MSBuild で、NuGetの復元が要るかの判定を確かめる(Issue #116)。
        run: ./Tests/Restore.Tests.ps1

      - name: build.ps1 configuration tests
        shell: pwsh
        # build.ps1 から構成を決める関数だけを取り出して呼び、-Project EngineUnitTests などが *Editor 構成のときに
        # Debug/Release へ読み替えられることを確かめる(Issue #129)。MSBuild もビルドも呼ばない。
        run: ./Tests/BuildConfiguration.Tests.ps1
